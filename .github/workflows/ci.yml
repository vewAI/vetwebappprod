name: CI

on:
  push:
    branches: [ 'dev', 'main' ]
  pull_request:
    branches: [ 'dev', 'main' ]

jobs:
  unit:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit & integration tests
        env:
          OPENAI_API_KEY: test
          NEXT_PUBLIC_SUPABASE_URL: https://fbqgvasmojoczpmeulqv.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZicWd2YXNtb2pvY3pwbWV1bHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI4MzQ1NzksImV4cCI6MjA2ODQxMDU3OX0.gdch4tkFVRBHRnAT8WHLHIbFtDsOV9Fk2Je0GvqjhXk
          SUPABASE_URL: https://fbqgvasmojoczpmeulqv.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZicWd2YXNtb2pvY3pwbWV1bHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI4MzQ1NzksImV4cCI6MjA2ODQxMDU3OX0.gdch4tkFVRBHRnAT8WHLHIbFtDsOV9Fk2Je0GvqjhXk
